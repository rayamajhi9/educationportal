<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      * { box-sizing: border-box; }
      body {
        color: #0f172a;
        font-family: sans-serif;
        margin: 0;
      }
      button {
        background: #fff;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        color: #0f172a;
        cursor: pointer;
        font: 600 14px/1.2 sans-serif;
        min-height: 40px;
        padding: 0 12px;
        white-space: nowrap;
        width: 100%;
      }
      button:disabled {
        cursor: wait;
        opacity: .7;
      }
      #status {
        color: #64748b;
        font-size: 12px;
        line-height: 1.3;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <button id="locate" type="button">◎ Your location</button>
    <div id="status" role="status" aria-live="polite"></div>
    <script>
      const button = document.getElementById("locate");
      const status = document.getElementById("status");
      const sendValue = (value) => {
        window.parent.postMessage({
          isStreamlitMessage: true,
          type: "streamlit:setComponentValue",
          value,
          dataType: "json"
        }, "*");
      };

      button.addEventListener("click", () => {
        status.textContent = "Requesting location permission…";
        if (!navigator.geolocation) {
          status.textContent = "Geolocation is not supported by this browser.";
          sendValue({ status: "unsupported", timestamp: Date.now() });
          return;
        }

        button.disabled = true;
        navigator.geolocation.getCurrentPosition(
          ({ coords }) => {
            button.disabled = false;
            status.textContent = "Location found. Centering map…";
            sendValue({
              status: "success",
              latitude: coords.latitude,
              longitude: coords.longitude,
              timestamp: Date.now()
            });
          },
          (error) => {
            button.disabled = false;
            const statuses = {
              1: ["denied", "Location permission was denied."],
              2: ["unavailable", "Your location is currently unavailable."],
              3: ["timeout", "The location request timed out."]
            };
            const [errorStatus, message] = statuses[error.code] || [
              "unavailable",
              "Could not determine your location."
            ];
            status.textContent = message;
            sendValue({ status: errorStatus, timestamp: Date.now() });
          },
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
        );
      });

      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:componentReady",
        apiVersion: 1
      }, "*");
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setFrameHeight",
        height: 48
      }, "*");
    </script>
  </body>
</html>
